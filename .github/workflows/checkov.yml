name: checkov

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  scan:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Terraform Analysis
        uses: ministryofjustice/modernisation-platform-github-actions/terraform-static-analysis@2988728879704953e739f82ac926d37931c6d01b #v6.1.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan_type: full
          checkov_external_modules: true
