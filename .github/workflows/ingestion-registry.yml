name: Ingestion Registry

on:
  pull_request:
    branches:
      - integration/data-hub-modularisation
    paths:
      - ".github/workflows/ingestion-registry.yml"
      - "modules/database-migration-service/ingestion-registry/**"
      - "modules/database-migration-service/modules/data-contract-management/runtime/schema-generation/**"
      - "modules/database-migration-service/modules/data-contract-management/runtime/schema-registration/**"
      - "modules/database-migration-service/modules/data-contract-management/runtime/schema-validation/**"

  push:
    branches:
      - integration/data-hub-modularisation
    paths:
      - ".github/workflows/ingestion-registry.yml"
      - "modules/database-migration-service/ingestion-registry/**"
      - "modules/database-migration-service/modules/data-contract-management/runtime/schema-generation/**"
      - "modules/database-migration-service/modules/data-contract-management/runtime/schema-registration/**"
      - "modules/database-migration-service/modules/data-contract-management/runtime/schema-validation/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    defaults:
      run:
        shell: bash
        working-directory: modules/database-migration-service/ingestion-registry

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install \
            --require-hashes \
            -r requirements-dev.lock

          python -m pip install \
            --no-deps \
            --no-build-isolation \
            -e .

          python -m pip check

      - name: Run Registry tests
        run: python -m pytest -c pytest.ini tests -q -p no:cacheprovider

      - name: Build wheel
        run: |
          python -m pip wheel \
            --no-deps \
            --no-build-isolation \
            --wheel-dir dist \
            .

      - name: Test installed wheel outside the source tree
        run: |
          set -euo pipefail

          wheel_venv="$RUNNER_TEMP/ingestion-registry-wheel"
          wheel_root="$RUNNER_TEMP/ingestion-registry-wheel-tests"
          wheel_tests="$wheel_root/modules/database-migration-service/ingestion-registry"
          wheel_runtime="$wheel_root/modules/database-migration-service/modules/data-contract-management/runtime"

          python -m venv "$wheel_venv"

          "$wheel_venv/bin/python" -m pip install \
            --require-hashes \
            -r requirements-dev.lock

          "$wheel_venv/bin/python" -m pip install \
            --no-deps \
            dist/*.whl

          "$wheel_venv/bin/python" -m pip check

          mkdir -p "$wheel_tests" "$wheel_runtime"

          cp -R tests "$wheel_tests/tests"

          cp -R \
            ../modules/data-contract-management/runtime/schema-generation \
            "$wheel_runtime/"

          cp -R \
            ../modules/data-contract-management/runtime/schema-registration \
            "$wheel_runtime/"

          cp -R \
            ../modules/data-contract-management/runtime/schema-validation \
            "$wheel_runtime/"

          printf '[pytest]\npythonpath = tests\n' \
            > "$wheel_tests/pytest.ini"

          cd "$wheel_tests"

          env -u PYTHONPATH \
            "$wheel_venv/bin/python" -m pytest \
            -c pytest.ini \
            tests \
            --import-mode=importlib \
            -q \
            -p no:cacheprovider