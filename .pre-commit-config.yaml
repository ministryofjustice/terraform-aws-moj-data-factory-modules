---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
        description: Do not upload files larger than 5000kb / 5MB to avoid data being uploaded
      - id: check-json
      - id: check-merge-conflict
        description: Check for merge conflict markers
      - id: check-yaml
      - id: detect-private-key
        description: Detect private keys in code
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
        description: Forces replacement of line endings with the UNIX 'lf' character
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: 79a6b2b1392eaf49cdd32ac4f14be1a809bbd8f7  # frozen: v1.37.1
    hooks:
      - id: yamllint
        description: Lint YAML files for style and syntax errors

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e05c5c0818279e5ac248ac9e954431ba58865e61  # frozen: v0.15.7
    hooks:
      - id: ruff-check
        args: ["--fix"]
        description: Python linting
      - id: ruff-format
        description: Python formatting

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        args:
          - -s
          - B101
        description: Python security linting (SAST)

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/terraform-docs/terraform-docs
    rev: 9d4455198941806aa02ec14369de030cda2c2b59  # frozen: v0.24.0
    hooks:
      - id: terraform-docs-system
        args: ["."]
        pass_filenames: false

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: 058f44e47719e80d8f1e597a235310b60e937860  # frozen: v10.2.0
    hooks:
      - id: cspell # Spell check changed files
        args:
          # - --config cspell.json
          - --no-progress

exclude: .devcontainer/devcontainer-lock.json
