---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
        description: Do not upload files larger than 5000kb / 5MB to avoid data being uploaded
      - id: check-json
      - id: check-merge-conflict
        description: Check for merge conflict markers
      - id: check-yaml
      - id: detect-private-key
        description: Detect private keys in code
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
        description: Forces replacement of line endings with the UNIX 'lf' character
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        description: Lint YAML files for style and syntax errors

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
        description: Python linting
      - id: ruff-format
        description: Python formatting

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        args:
          - -s
          - B101
        description: Python security linting (SAST)

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/terraform-docs/terraform-docs
    rev: d73141fa37317d84d924366385fb2a8552c0812b  # frozen: v0.25.1
    hooks:
      - id: terraform-docs-system
        args: ["."]
        pass_filenames: false

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: d3550f5482c2ed73e13f59eb33d95db4678a9343  # frozen: v10.4.1
    hooks:
      - id: cspell # Spell check changed files
        args:
          # - --config cspell.json
          - --no-progress

exclude: .devcontainer/devcontainer-lock.json
